name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Build desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: windows
          - os: macos-latest
            target: --mac --x64 --arm64
            artifact: macos
          - os: ubuntu-latest
            target: --linux
            artifact: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core, gateway and desktop UI
        run: |
          npm run build:core
          npm --workspace apps/gateway run build
          npm --workspace apps/desktop run build

      - name: Ensure app-builder binaries
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./node_modules/app-builder-bin/package.json').version")
          tmp=$(mktemp -d)
          curl -fsSL "https://registry.npmjs.org/app-builder-bin/-/app-builder-bin-${ver}.tgz" -o "$tmp/ab.tgz" || { echo "::error::download app-builder-bin failed"; exit 1; }
          tar xzf "$tmp/ab.tgz" -C "$tmp"
          rm -rf node_modules/app-builder-bin
          mv "$tmp/package" node_modules/app-builder-bin
          chmod +x node_modules/app-builder-bin/linux/*/app-builder node_modules/app-builder-bin/mac/app-builder_* 2>/dev/null || true
          ls -la node_modules/app-builder-bin/linux/x64/app-builder node_modules/app-builder-bin/mac/app-builder_arm64

      - name: Ensure both darwin DuckDB bindings
        # 一次跑出 x64 + arm64 两个 dmg，但 @duckdb/node-bindings 只会安装宿主架构那一个
        # optionalDependency。把另一架构的预编译绑定补进 node_modules，duckdb.js 会在运行时
        # 按 process.platform-process.arch 自行挑选。
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./node_modules/@duckdb/node-bindings/package.json').version")
          for arch in x64 arm64; do
            pkg="node-bindings-darwin-${arch}"
            if [ -f "node_modules/@duckdb/${pkg}/duckdb.node" ]; then
              echo "already present: ${pkg}"
            else
              tmp=$(mktemp -d)
              curl -fsSL "https://registry.npmjs.org/@duckdb/${pkg}/-/${pkg}-${ver}.tgz" -o "$tmp/pkg.tgz" || { echo "::error::download ${pkg} failed"; exit 1; }
              tar xzf "$tmp/pkg.tgz" -C "$tmp"
              rm -rf "node_modules/@duckdb/${pkg}"
              mv "$tmp/package" "node_modules/@duckdb/${pkg}"
              echo "fetched: ${pkg}"
            fi
            file "node_modules/@duckdb/${pkg}/duckdb.node"
          done

      - name: Diagnose toolchain
        shell: bash
        working-directory: apps/desktop
        run: |
          node -v
          npm -v
          echo "node_modules/.bin:"
          ls node_modules/.bin 2>/dev/null | grep -i electron || true
          ls ../../node_modules/.bin 2>/dev/null | grep -i electron || true
          npx --no-install electron-builder --version || true

      - name: Package installer
        shell: bash
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          npx electron-builder ${{ matrix.target }} --publish never 2>&1 | tee electron-builder.log

      - name: Verify both mac architectures
        # 交叉架构打包最容易出的错是「dmg 名字对了、里面的原生二进制错了」，
        # 所以这里同时校验主程序架构、DuckDB 绑定与 node-oracledb 绑定，
        # 并确认多余架构已被 afterPack 裁掉。
        if: runner.os == 'macOS'
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          shopt -s nullglob

          dmgs=(release/*.dmg)
          if [ ${#dmgs[@]} -ne 2 ]; then
            echo "::error::expected 2 dmg (x64 + arm64), got ${#dmgs[@]}"
            ls -l release || true
            exit 1
          fi
          ls -lh "${dmgs[@]}"

          check() {
            local appdir="$1" archname="$2" expect="$3" other="$4"
            local app bin duckdb oracle_bins
            if [ ! -d "$appdir" ]; then
              echo "::error::missing output dir $appdir"
              exit 1
            fi
            app=$(ls -d "$appdir"/*.app 2>/dev/null | head -n 1)
            if [ -z "$app" ] || [ ! -d "$app" ]; then
              echo "::error::no .app bundle inside $appdir"
              exit 1
            fi
            bin=$(ls "$app/Contents/MacOS/" | head -n 1)
            echo "--- $appdir -> $app (binary: $bin)"
            file "$app/Contents/MacOS/$bin"
            if ! file "$app/Contents/MacOS/$bin" | grep -q "$expect"; then
              echo "::error::$app main binary is not $expect"
              exit 1
            fi

            duckdb="$app/Contents/Resources/gateway/node_modules/@duckdb"
            if [ ! -d "$duckdb/node-bindings-darwin-$archname" ]; then
              echo "::error::$app is missing node-bindings-darwin-$archname"
              exit 1
            fi
            if [ -e "$duckdb/node-bindings-darwin-$other" ]; then
              echo "::error::$app still ships node-bindings-darwin-$other"
              exit 1
            fi
            echo "duckdb bindings: $(ls "$duckdb" | tr '\n' ' ')"

            oracle_bins=$(ls "$app/Contents/Resources/gateway/node_modules/oracledb/build/Release" 2>/dev/null | grep '\.node$' || true)
            echo "oracledb bindings: ${oracle_bins:-无}"
            if [ -n "$oracle_bins" ] && printf '%s\n' "$oracle_bins" | grep -qv "darwin-$archname"; then
              echo "::error::$app carries a node-oracledb binding for another architecture"
              exit 1
            fi
            if [ "$archname" = "arm64" ] && [ -z "$oracle_bins" ]; then
              echo "::error::$app is missing the darwin-arm64 node-oracledb binding"
              exit 1
            fi
            if [ "$archname" = "x64" ]; then
              echo "::warning::Intel 包不含 node-oracledb 绑定（上游 oracledb 26.0.0 无 darwin-x64 预编译），该包内 Oracle 驱动不可用"
            fi
          }

          check release/mac x64 x86_64 arm64
          check release/mac-arm64 arm64 arm64 x64

      - name: Report packaging error
        if: failure()
        shell: bash
        run: |
          log=apps/desktop/electron-builder.log
          if [ -f "$log" ]; then
            tail -n 25 "$log" | while IFS= read -r line; do echo "::error::$line"; done
          else
            echo "::error::electron-builder.log was not created"
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: aidb-${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: desktop
    runs-on: ubuntu-latest
    if: github.ref == 'refs/tags/v0.0.3'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: AiDB Studio v0.0.3
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            AiDB Studio **v0.0.3** — Intel Macs get their own installer, and Oracle stops being a coin flip.

            **Installers**
            - macOS: `AiDB Studio-0.0.3-arm64.dmg` for Apple Silicon, `AiDB Studio-0.0.3-x64.dmg` for Intel Macs (macOS 12+).
            - Windows: NSIS setup, Linux: AppImage.
            - The Intel dmg has no Oracle driver: node-oracledb 26 ships no `darwin-x64` prebuilt binding. Every other engine behaves the same on both architectures, and the app now greys Oracle out instead of letting the connection fail later.

            **Packaging**
            - macOS installers are built for both architectures from a single CI run; DuckDB and node-oracledb native bindings are now resolved per target instead of being copied from whatever the build host happened to install.
            - node-oracledb's native binding now ships with the app. Before this release every packaged build — not just Intel — failed Oracle connections with NJS-132.
            - The Bridge bundle defines `__dirname` / `__filename`, so a missing native binding reports the real cause instead of a `ReferenceError`.

            **Engines and interface**
            - Engines whose native binding is absent on the current machine are reported by the Bridge (`unavailableEngines` on `/health` and `/bootstrap`) and greyed out in the new-connection dialog with the reason; test and save are disabled for them.
            - Windows and Linux no longer draw a second brand title bar below the native one.
            - New query follows the database selected in the object tree.

            **Agent**
            - Offline reasoner: NL→SQL planner with bounded value probing, semantic grounding, remembered conventions, several questions in one sentence, business context treated as a hard constraint, and per-engine native routing so non-SQL engines use their own query language.
            - Chart retrieval now covers heatmap, radar and stacked charts, and answers come back in the interface language.
            - Self-hosted SearXNG instances on the LAN are accepted.
            - Follow-up suggestions share the message left baseline and wrap with the panel width.

            **Verification**
            - 480 Bridge tests, 391 documentation-contract checks, plus a Playwright pass over the greyed-engine flow (option disabled, forced click rejected, edit dialog shows the reason and disables save and test).

            Installers are built by GitHub Actions from this tag.
          files: |
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.AppImage
            dist-release/*.yml
            dist-release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
