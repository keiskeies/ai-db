name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Build desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: windows
          - os: macos-latest
            target: --mac --x64 --arm64
            artifact: macos
          - os: ubuntu-latest
            target: --linux
            artifact: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core, gateway and desktop UI
        run: |
          npm run build:core
          npm --workspace apps/gateway run build
          npm --workspace apps/desktop run build

      - name: Ensure app-builder binaries
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./node_modules/app-builder-bin/package.json').version")
          tmp=$(mktemp -d)
          curl -fsSL "https://registry.npmjs.org/app-builder-bin/-/app-builder-bin-${ver}.tgz" -o "$tmp/ab.tgz" || { echo "::error::download app-builder-bin failed"; exit 1; }
          tar xzf "$tmp/ab.tgz" -C "$tmp"
          rm -rf node_modules/app-builder-bin
          mv "$tmp/package" node_modules/app-builder-bin
          chmod +x node_modules/app-builder-bin/linux/*/app-builder node_modules/app-builder-bin/mac/app-builder_* 2>/dev/null || true
          ls -la node_modules/app-builder-bin/linux/x64/app-builder node_modules/app-builder-bin/mac/app-builder_arm64

      - name: Ensure both darwin DuckDB bindings
        # 一次跑出 x64 + arm64 两个 dmg，但 @duckdb/node-bindings 只会安装宿主架构那一个
        # optionalDependency。把另一架构的预编译绑定补进 node_modules，duckdb.js 会在运行时
        # 按 process.platform-process.arch 自行挑选。
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./node_modules/@duckdb/node-bindings/package.json').version")
          for arch in x64 arm64; do
            pkg="node-bindings-darwin-${arch}"
            if [ -f "node_modules/@duckdb/${pkg}/duckdb.node" ]; then
              echo "already present: ${pkg}"
            else
              tmp=$(mktemp -d)
              curl -fsSL "https://registry.npmjs.org/@duckdb/${pkg}/-/${pkg}-${ver}.tgz" -o "$tmp/pkg.tgz" || { echo "::error::download ${pkg} failed"; exit 1; }
              tar xzf "$tmp/pkg.tgz" -C "$tmp"
              rm -rf "node_modules/@duckdb/${pkg}"
              mv "$tmp/package" "node_modules/@duckdb/${pkg}"
              echo "fetched: ${pkg}"
            fi
            file "node_modules/@duckdb/${pkg}/duckdb.node"
          done

      - name: Diagnose toolchain
        shell: bash
        working-directory: apps/desktop
        run: |
          node -v
          npm -v
          echo "node_modules/.bin:"
          ls node_modules/.bin 2>/dev/null | grep -i electron || true
          ls ../../node_modules/.bin 2>/dev/null | grep -i electron || true
          npx --no-install electron-builder --version || true

      - name: Package installer
        shell: bash
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          npx electron-builder ${{ matrix.target }} --publish never 2>&1 | tee electron-builder.log

      - name: Verify both mac architectures
        # 交叉架构打包最容易出的错是「dmg 名字对了、里面的原生绑定错了」，
        # 所以这里同时校验主程序架构与 DuckDB 绑定，并确认多余架构已被 afterPack 裁掉。
        if: runner.os == 'macOS'
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          shopt -s nullglob

          dmgs=(release/*.dmg)
          if [ ${#dmgs[@]} -ne 2 ]; then
            echo "::error::expected 2 dmg (x64 + arm64), got ${#dmgs[@]}"
            ls -l release || true
            exit 1
          fi
          ls -lh "${dmgs[@]}"

          check() {
            local appdir="$1" keep="$2" expect="$3" drop="$4"
            local app bin duckdb
            if [ ! -d "$appdir" ]; then
              echo "::error::missing output dir $appdir"
              exit 1
            fi
            app=$(ls -d "$appdir"/*.app 2>/dev/null | head -n 1)
            if [ -z "$app" ] || [ ! -d "$app" ]; then
              echo "::error::no .app bundle inside $appdir"
              exit 1
            fi
            bin=$(ls "$app/Contents/MacOS/" | head -n 1)
            echo "--- $appdir -> $app (binary: $bin)"
            file "$app/Contents/MacOS/$bin"
            if ! file "$app/Contents/MacOS/$bin" | grep -q "$expect"; then
              echo "::error::$app main binary is not $expect"
              exit 1
            fi
            duckdb="$app/Contents/Resources/gateway/node_modules/@duckdb"
            if [ ! -d "$duckdb/$keep" ]; then
              echo "::error::$app is missing $keep"
              exit 1
            fi
            if [ -e "$duckdb/$drop" ]; then
              echo "::error::$app still ships $drop"
              exit 1
            fi
            echo "bindings: $(ls "$duckdb" | tr '\n' ' ')"
          }

          check release/mac node-bindings-darwin-x64 x86_64 node-bindings-darwin-arm64
          check release/mac-arm64 node-bindings-darwin-arm64 arm64 node-bindings-darwin-x64

      - name: Report packaging error
        if: failure()
        shell: bash
        run: |
          log=apps/desktop/electron-builder.log
          if [ -f "$log" ]; then
            tail -n 25 "$log" | while IFS= read -r line; do echo "::error::$line"; done
          else
            echo "::error::electron-builder.log was not created"
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: aidb-${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: desktop
    runs-on: ubuntu-latest
    if: github.ref == 'refs/tags/v0.0.2'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: AiDB Studio v0.0.2
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            AiDB Studio **v0.0.2** — the agent-first database workbench.

            **Installers**
            - macOS: `AiDB Studio-0.0.2-arm64.dmg` for Apple Silicon, `AiDB Studio-0.0.2-x64.dmg` for Intel Macs (macOS 12+).
            - Windows: NSIS setup, Linux: AppImage.

            This release is about engines that refuse to behave the same way and about waiting less.

            **Engine compatibility**
            - Metadata is now read per probe and degrades one section at a time, so a server that denies one catalog still shows every table, column, index and key it permits — an empty tree no longer means "no data".
            - Elasticsearch / OpenSearch 6, 7 and 8: typed mappings, numeric vs object `hits.total`, `track_total_hits` only where it exists, and an `_all/_mapping` fallback when a role lacks the cluster-monitor privilege that `_cat/indices` needs.
            - Oracle 11g reads structure without `ORACLE_MAINTAINED` / `IDENTITY_COLUMN`; thin mode stays for 12.1+, thick mode is available through `AIDB_ORACLE_CLIENT_DIR`.
            - PostgreSQL 9.x and Greenplum get index parsing that does not need `array_position`; identity and generated columns are reported when the catalog exposes them.
            - MySQL-family servers with partial `information_schema` (Doris, StarRocks, GBase 8a) fall back to `SHOW DATABASES`.
            - By generation: InfluxDB 1.x is served over `/query` + `/write` with InfluxQL while 3.x keeps DataFusion SQL, Milvus reports the 2.4 REST requirement instead of looking offline, Neo4j 3.x sessions drop the database parameter. Cassandra 2.x, MongoDB and DM legacy OpenSSL are handled the same way.
            - New connection options: encrypt-but-do-not-verify TLS, Elasticsearch / OpenSearch API key auth, MongoDB replica set · auth source · direct connection, and Redis Cluster as a deployment mode.

            **Performance**
            - Backups stream to disk and page by primary key instead of materialising the whole database in memory; restore replays the dump in ~4 MB script batches.
            - Metadata collection runs with bounded concurrency, row-count estimates push `LIMIT` into the query, and first-paint schema loading is throttled.
            - Desktop first load shrinks from 7.09 MB to 0.71 MB of JavaScript (0.82 MB raw / 0.26 MB gzipped including CSS): 19 of 20 language catalogs, the SQL editor, the Markdown renderer, every toolbox panel and every context-menu dialog now arrive on demand.

            **Runtime and interface**
            - Node 22.13+ is required for `node:sqlite`; exported SQL writes boolean, date and binary literals in the target dialect.
            - Single-database connections load their object tree automatically, and native dropdowns were replaced by the themed control everywhere.

            **Verification**
            - 294 end-to-end checks (v0.0.1 shipped 263), 476 unit and integration tests, 391 documentation-contract checks, and a chunk-level probe that proves the lazy loading and per-language catalogs.

            Installers are built by GitHub Actions from this tag.
          files: |
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.AppImage
            dist-release/*.yml
            dist-release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
