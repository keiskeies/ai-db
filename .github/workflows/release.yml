name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Build desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: windows
          - os: macos-latest
            target: --mac
            artifact: macos
          # ubuntu-latest 已升到 RPM 6，fpm 1.9.3 生成的 spec 会被 rpmbuild 直接拒绝；
          # 固定 24.04（RPM 4.18）保证 AppImage/deb/rpm 全链路可用
          - os: ubuntu-24.04
            target: --linux
            artifact: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core, gateway and desktop UI
        run: |
          npm run build:core
          npm --workspace apps/gateway run build
          npm --workspace apps/desktop run build

      - name: Ensure app-builder binaries
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./node_modules/app-builder-bin/package.json').version")
          tmp=$(mktemp -d)
          curl -fsSL "https://registry.npmjs.org/app-builder-bin/-/app-builder-bin-${ver}.tgz" -o "$tmp/ab.tgz" || { echo "::error::download app-builder-bin failed"; exit 1; }
          tar xzf "$tmp/ab.tgz" -C "$tmp"
          rm -rf node_modules/app-builder-bin
          mv "$tmp/package" node_modules/app-builder-bin
          chmod +x node_modules/app-builder-bin/linux/*/app-builder node_modules/app-builder-bin/mac/app-builder_* 2>/dev/null || true
          ls -la node_modules/app-builder-bin/linux/x64/app-builder node_modules/app-builder-bin/mac/app-builder_arm64

      - name: Ensure cross-arch DuckDB bindings
        # 每个平台一次跑出 x64 + arm64，但 @duckdb/node-bindings 只会安装宿主架构那一个
        # optionalDependency。把另一架构的预编译绑定补进 node_modules，duckdb.js 运行时会
        # 按 process.platform-process.arch 自行挑选，afterPack 再按架构裁掉多余那份。
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./node_modules/@duckdb/node-bindings/package.json').version")
          case "$RUNNER_OS" in
            macOS) pkgs="node-bindings-darwin-x64 node-bindings-darwin-arm64" ;;
            Linux) pkgs="node-bindings-linux-x64 node-bindings-linux-arm64" ;;
            Windows) pkgs="node-bindings-win32-x64 node-bindings-win32-arm64" ;;
            *) echo "::error::unsupported runner $RUNNER_OS"; exit 1 ;;
          esac
          for pkg in $pkgs; do
            if [ -f "node_modules/@duckdb/${pkg}/duckdb.node" ]; then
              echo "already present: ${pkg}"
              continue
            fi
            tmp=$(mktemp -d)
            curl -fsSL "https://registry.npmjs.org/@duckdb/${pkg}/-/${pkg}-${ver}.tgz" -o "$tmp/pkg.tgz" || { echo "::error::download ${pkg} failed"; exit 1; }
            tar xzf "$tmp/pkg.tgz" -C "$tmp"
            rm -rf "node_modules/@duckdb/${pkg}"
            mv "$tmp/package" "node_modules/@duckdb/${pkg}"
            echo "fetched: ${pkg}"
          done
          ls -d node_modules/@duckdb/node-bindings-* | xargs -n1 basename

      - name: Diagnose toolchain
        shell: bash
        working-directory: apps/desktop
        run: |
          node -v
          npm -v
          echo "node_modules/.bin:"
          ls node_modules/.bin 2>/dev/null | grep -i electron || true
          ls ../../node_modules/.bin 2>/dev/null | grep -i electron || true
          npx --no-install electron-builder --version || true

      - name: Surface rpmbuild errors
        # fpm 只抛出 "rpmbuild failed (exit code 1)"，真实 stderr 被吞掉；包一层带出来
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          real=$(command -v rpmbuild || true)
          if [ -z "$real" ]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rpm
            real=$(command -v rpmbuild || true)
          fi
          if [ -z "$real" ]; then
            echo "::error::rpmbuild is not installed and could not be installed"
            exit 1
          fi
          echo "rpmbuild: $real ($("$real" --version | head -n 1))"
          df -h /tmp / || true
          mkdir -p "$RUNNER_TEMP/rpmbin"
          {
            echo '#!/bin/bash'
            echo '"$REAL_RPMBUILD" "$@" > "$RUNNER_TEMP/rpmbuild.out" 2>&1'
            echo 'rc=$?'
            echo 'if [ "$rc" -ne 0 ]; then'
            echo '  echo "::error::rpmbuild failed (exit $rc): $*"'
            echo '  tail -n 40 "$RUNNER_TEMP/rpmbuild.out" | while IFS= read -r line; do echo "::error::$line"; done'
            echo 'fi'
            echo 'exit "$rc"'
          } > "$RUNNER_TEMP/rpmbin/rpmbuild"
          chmod +x "$RUNNER_TEMP/rpmbin/rpmbuild"
          echo "REAL_RPMBUILD=$real" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/rpmbin" >> "$GITHUB_PATH"

      - name: Package installer
        # 每个架构单独跑一次：NSIS 在一次传入多个架构时会额外产出一个合并安装器
        # （约 284 MB，内容与两个单架构包重复），分开跑才只留 x64 / arm64 各自的安装器。
        shell: bash
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          : > electron-builder.log
          for arch in x64 arm64; do
            # Windows 的更新元数据只有一份 latest.yml（不像 Linux 会带 -linux-arm64 后缀），
            # 两个架构分别打包会互相覆盖，所以 arm64 走独立通道 latest-arm64.yml，
            # 客户端按 process.arch 选同名文件（见 apps/desktop/electron/updater.cjs）。
            extra=""
            if [ "${{ matrix.artifact }}" = "windows" ] && [ "$arch" = "arm64" ]; then
              extra="-c.publish.channel=latest-arm64"
            fi
            echo "=== ${{ matrix.target }} --${arch} ${extra}"
            npx electron-builder ${{ matrix.target }} --${arch} ${extra} --publish never 2>&1 | tee -a electron-builder.log
          done

      - name: Verify mac architectures
        # 交叉架构打包最容易出的错是「dmg 名字对了、里面的原生二进制错了」，
        # 所以这里同时校验主程序架构、DuckDB 绑定与 node-oracledb 绑定，
        # 并确认多余架构已被 afterPack 裁掉。
        if: runner.os == 'macOS'
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          shopt -s nullglob

          dmgs=(release/*.dmg)
          if [ ${#dmgs[@]} -ne 2 ]; then
            echo "::error::expected 2 dmg (x64 + arm64), got ${#dmgs[@]}"
            ls -l release || true
            exit 1
          fi
          ls -lh "${dmgs[@]}"

          check() {
            local appdir="$1" archname="$2" expect="$3" other="$4"
            local app bin duckdb oracle_bins
            if [ ! -d "$appdir" ]; then
              echo "::error::missing output dir $appdir"
              exit 1
            fi
            app=$(ls -d "$appdir"/*.app 2>/dev/null | head -n 1)
            if [ -z "$app" ] || [ ! -d "$app" ]; then
              echo "::error::no .app bundle inside $appdir"
              exit 1
            fi
            bin=$(ls "$app/Contents/MacOS/" | head -n 1)
            echo "--- $appdir -> $app (binary: $bin)"
            file "$app/Contents/MacOS/$bin"
            if ! file "$app/Contents/MacOS/$bin" | grep -q "$expect"; then
              echo "::error::$app main binary is not $expect"
              exit 1
            fi

            duckdb="$app/Contents/Resources/gateway/node_modules/@duckdb"
            if [ ! -d "$duckdb/node-bindings-darwin-$archname" ]; then
              echo "::error::$app is missing node-bindings-darwin-$archname"
              exit 1
            fi
            if [ -e "$duckdb/node-bindings-darwin-$other" ]; then
              echo "::error::$app still ships node-bindings-darwin-$other"
              exit 1
            fi
            echo "duckdb bindings: $(ls "$duckdb" | tr '\n' ' ')"

            oracle_bins=$(ls "$app/Contents/Resources/gateway/node_modules/oracledb/build/Release" 2>/dev/null | grep '\.node$' || true)
            echo "oracledb bindings: ${oracle_bins:-无}"
            if [ -n "$oracle_bins" ] && printf '%s\n' "$oracle_bins" | grep -qv "darwin-$archname"; then
              echo "::error::$app carries a node-oracledb binding for another architecture"
              exit 1
            fi
            if [ "$archname" = "arm64" ] && [ -z "$oracle_bins" ]; then
              echo "::error::$app is missing the darwin-arm64 node-oracledb binding"
              exit 1
            fi
            if [ "$archname" = "x64" ]; then
              echo "::warning::Intel 包不含 node-oracledb 绑定（上游 oracledb 26.0.0 无 darwin-x64 预编译），该包内 Oracle 驱动不可用"
            fi
          }

          check release/mac x64 x86_64 arm64
          check release/mac-arm64 arm64 arm64 x64

      - name: Verify Linux artifacts
        # deb / rpm / AppImage 各出两份（x64 + arm64），并核对解包目录里的原生绑定。
        if: runner.os == 'Linux'
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          shopt -s nullglob

          appimages=(release/*.AppImage)
          debs=(release/*.deb)
          rpms=(release/*.rpm)
          if [ ${#appimages[@]} -ne 2 ] || [ ${#debs[@]} -ne 2 ] || [ ${#rpms[@]} -ne 2 ]; then
            echo "::error::expected 2 files per format (x64 + arm64): AppImage=${#appimages[@]} deb=${#debs[@]} rpm=${#rpms[@]}"
            ls -l release || true
            exit 1
          fi
          ls -lh "${appimages[@]}" "${debs[@]}" "${rpms[@]}"

          check() {
            local dir="$1" archname="$2" expect="$3" other="$4"
            local bin duckdb oracle_bins
            if [ ! -d "$dir" ]; then
              echo "::error::missing output dir $dir"
              exit 1
            fi
            bin="$dir/aidb-studio"
            [ -f "$bin" ] || { echo "::error::missing executable $bin"; exit 1; }
            echo "--- $dir (binary: $bin)"
            file "$bin"
            if ! file "$bin" | grep -q "$expect"; then
              echo "::error::$dir main binary is not $expect"
              exit 1
            fi

            duckdb="$dir/resources/gateway/node_modules/@duckdb"
            if [ ! -d "$duckdb/node-bindings-linux-$archname" ]; then
              echo "::error::$dir is missing node-bindings-linux-$archname"
              exit 1
            fi
            if [ -e "$duckdb/node-bindings-linux-$other" ]; then
              echo "::error::$dir still ships node-bindings-linux-$other"
              exit 1
            fi
            echo "duckdb bindings: $(ls "$duckdb" | tr '\n' ' ')"

            oracle_bins=$(ls "$dir/resources/gateway/node_modules/oracledb/build/Release" 2>/dev/null | grep '\.node$' || true)
            echo "oracledb bindings: ${oracle_bins:-无}"
            if ! printf '%s\n' "$oracle_bins" | grep -q "linux-$archname"; then
              echo "::error::$dir is missing the linux-$archname node-oracledb binding"
              exit 1
            fi
            if printf '%s\n' "$oracle_bins" | grep -qv "linux-$archname"; then
              echo "::error::$dir carries a node-oracledb binding for another architecture"
              exit 1
            fi
          }

          check release/linux-unpacked x64 x86-64 arm64
          check release/linux-arm64-unpacked arm64 aarch64 x64

      - name: Verify Windows artifacts
        # arm64 的 Oracle 上游没有预编译绑定（win32-arm64 缺），只告警不判失败。
        if: runner.os == 'Windows'
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          ls -lh release/*.exe
          if [ "$(ls -1 release/*.exe | wc -l | tr -d ' ')" -ne 2 ]; then
            echo "::error::expected 2 exe (x64 + arm64)"
            exit 1
          fi

          check() {
            local dir="$1" archname="$2" other="$3"
            local duckdb oracle_bins
            if [ ! -d "$dir" ]; then
              echo "::error::missing output dir $dir"
              exit 1
            fi
            duckdb="$dir/resources/gateway/node_modules/@duckdb"
            if [ ! -d "$duckdb/node-bindings-win32-$archname" ]; then
              echo "::error::$dir is missing node-bindings-win32-$archname"
              exit 1
            fi
            if [ -e "$duckdb/node-bindings-win32-$other" ]; then
              echo "::error::$dir still ships node-bindings-win32-$other"
              exit 1
            fi
            echo "--- $dir duckdb: $(ls "$duckdb" | tr '\n' ' ')"

            oracle_bins=$(ls "$dir/resources/gateway/node_modules/oracledb/build/Release" 2>/dev/null | grep '\.node$' || true)
            echo "oracledb bindings: ${oracle_bins:-无}"
            if [ -n "$oracle_bins" ] && printf '%s\n' "$oracle_bins" | grep -qv "win32-$archname"; then
              echo "::error::$dir carries a node-oracledb binding for another architecture"
              exit 1
            fi
          }

          check release/win-unpacked x64 arm64
          check release/win-arm64-unpacked arm64 x64

          x64_oracle=$(ls release/win-unpacked/resources/gateway/node_modules/oracledb/build/Release 2>/dev/null | grep -c '\.node$' || true)
          if [ "${x64_oracle:-0}" -eq 0 ]; then
            echo "::error::win x64 build lost its node-oracledb binding"
            exit 1
          fi
          echo "::warning::Windows arm64 不含 node-oracledb 绑定（上游无 win32-arm64 预编译），该包内 Oracle 驱动不可用"

      - name: Pack Windows portable zips
        # 绿色版：把校验过的 win-unpacked 目录以产品名打成 zip，解压后运行里面的 exe 即可。
        # NSIS 安装器写 HKCU 的卸载项和快捷方式，绿色版没有这一步；Electron 本体不碰
        # 注册表，用户数据照旧在 %APPDATA%\AiDB Studio。zip 名以 -portable.zip 结尾，
        # 不会被 pickAsset 的 -setup.exe 后缀匹配到，不影响自动更新通道。
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $ErrorActionPreference = 'Stop'
          $7z = Join-Path ${env:ProgramFiles} '7-Zip\7z.exe'
          $ver = node -p "require('./package.json').version"
          $pairs = @(
            @{ unpacked = 'win-unpacked';       arch = 'x64' },
            @{ unpacked = 'win-arm64-unpacked'; arch = 'arm64' }
          )
          foreach ($p in $pairs) {
            $dir = "release/$($p.unpacked)"
            if (-not (Test-Path $dir)) { Write-Error "missing $dir"; exit 1 }
            # zip 根目录用产品名而不是 win-unpacked，解压出来的文件夹才体面
            Rename-Item $dir 'AiDB Studio'
            # zip 直接落在 release/ 下（上传步骤的 glob 是 release/*.zip）：
            # 从 release/ 里以 ..\ 输出会写到 apps/desktop/，glob 匹配不到还不报错
            Push-Location release
            try {
              & $7z a -tzip -mx=1 "AiDB-Studio-$ver-$($p.arch)-portable.zip" '.\AiDB Studio' | Out-Null
            } finally {
              Pop-Location
              Rename-Item 'release/AiDB Studio' $p.unpacked
            }
          }
          $zips = @(Get-ChildItem release/*-portable.zip)
          if ($zips.Count -ne 2) { Write-Error "expected 2 portable zips, got $($zips.Count)"; exit 1 }
          $zips | Format-Table Name, Length

      - name: Report packaging error
        if: failure()
        shell: bash
        run: |
          log=apps/desktop/electron-builder.log
          if [ -f "$log" ]; then
            tail -n 25 "$log" | while IFS= read -r line; do echo "::error::$line"; done
          else
            echo "::error::electron-builder.log was not created"
          fi
          # rpmbuild 的 stderr 被 fpm 吞掉，wrapper 已把它写到这个文件
          out="$RUNNER_TEMP/rpmbuild.out"
          if [ -f "$out" ]; then
            tail -n 60 "$out" | while IFS= read -r line; do echo "::error::rpmbuild: $line"; done
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: aidb-${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build release APK
        working-directory: apps/mobile/android
        # Expo CLI 默认把 Metro 根设成 monorepo 根，而 RN Gradle 插件传的是相对 apps/mobile 的入口，
        # 不开这个开关会去仓库根找 index.ts。
        env:
          EXPO_NO_METRO_WORKSPACE_ROOT: '1'
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/mobile/app.json').expo.version")
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::missing $apk"
            exit 1
          fi
          size=$(stat -c%s "$apk")
          if [ "$size" -lt 20000000 ]; then
            echo "::error::APK is only ${size} bytes — Metro bundle missing?"
            exit 1
          fi
          app_id=$(node -p "require('./apps/mobile/app.json').expo.android.package")
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          badging=$("$aapt2" dump badging "$apk" | head -n 1)
          echo "$badging"
          case "$badging" in
            *"package: name='$app_id'"*"versionName='$version'"*) ;;
            *) echo "::error::APK identity mismatch, expected $app_id $version"; exit 1 ;;
          esac
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/' || { echo "::error::APK lacks arm64-v8a libraries"; exit 1; }
          mkdir -p dist-mobile
          cp "$apk" "dist-mobile/AiDB-Studio-$version-android.apk"
          ls -lh dist-mobile/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aidb-android
          path: dist-mobile/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: Build iOS (EAS)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # iOS 需要 Expo + Apple 两个账号；账号没备齐时只告警跳过，不能拦住桌面发布
    continue-on-error: true
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # eas-cli 在上传前会在本地解析 app.json 的 config plugins，没有 node_modules 会直接失败
      - name: Install dependencies
        run: npm ci

      - name: Verify native version sync
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const version = require("./apps/mobile/app.json").expo.version;
            const plist = fs.readFileSync("apps/mobile/ios/AiDBStudio/Info.plist", "utf8");
            const xcode = fs.readFileSync("apps/mobile/ios/AiDBStudio.xcodeproj/project.pbxproj", "utf8");
            const marker = "<key>CFBundleShortVersionString</key>";
            const tail = plist.slice(plist.indexOf(marker) + marker.length);
            const short = tail.slice(tail.indexOf("<string>") + 8, tail.indexOf("</string>"));
            const marketing = xcode.split("MARKETING_VERSION = ").slice(1).map((part) => part.slice(0, part.indexOf(";")));
            const wrong = marketing.filter((v) => v !== version);
            if (short !== version || marketing.length === 0 || wrong.length > 0) {
              console.error("::error::iOS version drift: app.json " + version + ", Info.plist " + short + ", wrong MARKETING_VERSION entries " + wrong.length);
              process.exit(1);
            }
            console.log("iOS native version synced: " + version);
          '

      - name: Check EAS configuration
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          project=$(node -p 'require("./apps/mobile/app.json").expo.extra?.eas?.projectId ?? ""')
          ok=1
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::warning::EXPO_TOKEN secret is not set — iOS build skipped. One-time setup is documented under Mobile builds in README."
            ok=0
          fi
          if [ "$project" = "00000000-0000-0000-0000-000000000000" ] || [ -z "$project" ]; then
            echo "::warning::EAS projectId is still the placeholder — run eas init in apps/mobile, commit the real id, then rerun. iOS build skipped."
            ok=0
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Trigger EAS build
        if: steps.guard.outputs.ok == '1'
        working-directory: apps/mobile
        run: |
          set -o pipefail
          npx --yes eas-cli@27.11.0 build --platform ios --profile preview --non-interactive --wait --json > eas-build.json
          node -e '
            const [build] = require("./eas-build.json");
            if (!build?.artifacts?.buildUrl) {
              console.error("EAS build finished without an artifact URL");
              process.exit(1);
            }
            console.log(build.artifacts.buildUrl);
          ' > ipa-url.txt

      - name: Download IPA
        if: steps.guard.outputs.ok == '1'
        shell: bash
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          version=$(node -p "require('./app.json').expo.version")
          mkdir -p ../../dist-mobile
          curl -fsSL "$(cat ipa-url.txt)" -o "../../dist-mobile/AiDB-Studio-$version-ios.ipa"
          ls -lh "../../dist-mobile/AiDB-Studio-$version-ios.ipa"

      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.ok == '1'
        with:
          name: aidb-ios
          path: dist-mobile/*.ipa
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Verify update metadata
        # latest*.yml 里引用的文件名必须与实际上传的资产完全一致：electron-builder 写元数据时
        # 把空格换成 "-"，GitHub 上传时把空格换成 "."，两边不一致时自动更新会在下载阶段 404，
        # 而且只有用户真的点了「检查更新」才会暴露，所以在这里提前拦。
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist-release/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no latest*.yml in release artifacts"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = "dist-release";
            let bad = 0;
            for (const name of fs.readdirSync(dir).filter((f) => /^latest.*\.yml$/.test(f))) {
              const text = fs.readFileSync(path.join(dir, name), "utf8");
              const refs = [
                ...[...text.matchAll(/^\s*-?\s*url:\s*(\S+)/gm)].map((m) => m[1]),
                ...[...text.matchAll(/^path:\s*(\S+)/gm)].map((m) => m[1]),
              ];
              for (const ref of refs) {
                if (!fs.existsSync(path.join(dir, ref))) {
                  console.error(`::error::${name} references missing asset ${ref}`);
                  bad += 1;
                }
              }
              console.log(`${name}: ${refs.length} asset reference(s) checked`);
            }
            process.exit(bad ? 1 : 0);
          '

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: AiDB Studio ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            AiDB Studio **v0.0.10** — the app is now built for every platform by GitHub Actions, including Android and iOS, and the mobile identity moves to the project's own domain.

            **All platforms from CI**
            - Windows, macOS and Linux installers keep the same feature set. The Linux job is pinned to Ubuntu 24.04 because the current `ubuntu-latest` ships RPM 6, which rejects the spec generated by electron-builder's bundled fpm 1.9.3.
            - **Android** ships as a universal APK (arm64-v8a, armeabi-v7a, x86, x86_64), built with Gradle in CI and signed with a stable debug key. It is ready for sideloading, not for Google Play.
            - **iOS** ships as an ad-hoc IPA built by EAS and attached here. Apple credentials live on EAS; GitHub only needs an Expo access token. The IPA installs on devices registered in the ad-hoc profile.
            - Mobile versions come from `apps/mobile/app.json`; Android's `versionName`/`versionCode` derive from it, and CI asserts iOS `MARKETING_VERSION` matches.

            **Identity change**
            - Android package `top.keiskei.aidb`, iOS bundle id `top.keiskei.ai-db`, desktop appId `top.keiskei.aidb` (previously `com.aidb.studio`).
            - Android: the new package id installs alongside the old app; uninstall the `com.aidb.studio` build first.
            - iOS: the new bundle id is a separate app from earlier test builds.
            - Windows: uninstall 0.0.9 first — the uninstall entry and taskbar identity are keyed by appId, so an in-place upgrade would leave a duplicate entry.
            - Linux deb/rpm keep the `aidb-studio` package name and upgrade normally; the AppImage is replaced manually.

            **iOS startup fix**
            - The first EAS build exited as soon as the pairing screen mounted: the committed native project was missing `NSCameraUsageDescription`, `NSLocalNetworkUsageDescription`, `NSBonjourServices` and `NSPhotoLibraryUsageDescription`, and expo-camera raises a fatal error when the camera usage string is absent. The keys were added to the native Info.plist — EAS uses the committed native project and does not apply `app.json` plugins when `ios/` exists.

            **Installers**

            | Platform | Architecture | Files |
            |---|---|---|
            | Windows | x64 | `AiDB-Studio-0.0.10-x64-setup.exe` · `AiDB-Studio-0.0.10-x64-portable.zip` |
            | Windows | arm64 | `AiDB-Studio-0.0.10-arm64-setup.exe` · `AiDB-Studio-0.0.10-arm64-portable.zip` |
            | macOS | Apple Silicon | `AiDB-Studio-0.0.10-arm64.dmg` |
            | macOS | Intel | `AiDB-Studio-0.0.10-x64.dmg` |
            | Linux | x64 | `AiDB-Studio-0.0.10-x86_64.AppImage` · `-amd64.deb` · `-x86_64.rpm` |
            | Linux | arm64 | `AiDB-Studio-0.0.10-arm64.AppImage` · `-arm64.deb` · `-aarch64.rpm` |
            | Android | universal | `AiDB-Studio-0.0.10-android.apk` |
            | iOS | arm64 | `AiDB-Studio-0.0.10-ios.ipa` |

            **Platform notes**
            - Oracle needs a prebuilt node-oracledb binding; upstream ships none for macOS Intel or Windows arm64, so the engine is greyed out there with the reason. Linux arm64 does ship it.
            - Linux deb/rpm install through the package manager; the AppImage is portable but needs FUSE 2. RPMs are produced on Ubuntu 24.04 (RPM 4.18).
            - The Android APK is debug-signed for internal distribution; sideload it or install with `adb install`. Do not publish it to a store without a release keystore.
            - The iOS IPA is ad-hoc distribution: only devices registered in the EAS provisioning profile can install it. Install it from the EAS build page or with Apple Configurator.
            - macOS builds stay unsigned; the update card links to this release instead of replacing the app. Windows NSIS and Linux AppImage auto-update channels keep working for installs of this version.

            **Verification**
            - CI builds the six desktop combinations (Windows/macOS/Linux × x64/arm64), the Android APK and the iOS IPA from this tag, and asserts the APK's package id, version and native bindings before publishing.
            - The iOS credentials were created through EAS; the project is linked to `@keiskeies/aidb-studio`.
          files: |
            dist-release/*.exe
            dist-release/*.zip
            dist-release/*.dmg
            dist-release/*.AppImage
            dist-release/*.deb
            dist-release/*.rpm
            dist-release/*.apk
            dist-release/*.ipa
            # 自动更新的元数据（latest.yml / latest-linux.yml）：客户端靠它判断版本与差分下载。
            # 只取 latest 前缀，避免把 electron-builder 的 builder-debug.yml 也发上线。
            dist-release/latest*.yml
            dist-release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
