name: Publish MCP package

# npm trusted publishing authorizes this workflow filename. If it is renamed,
# update the trusted publisher on npmjs.com. The protected `release` environment
# supplies the human approval gate; no npm token is stored in the repository.
on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing mcp-v* tag to test and publish.
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  package:
    name: Verify and pack MCP tarball
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha: ${{ needs.quality.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.quality.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify package identity and contents
        working-directory: packages/aidb-mcp
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          if [ "$name" != "@aidb-studio/aidb-studio" ]; then
            echo "::error::packages/aidb-mcp name is $name; trusted publishing expects @aidb-studio/aidb-studio"
            exit 1
          fi
          expected="mcp-v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error::tag $RELEASE_TAG does not match packages/aidb-mcp/package.json; expected $expected"
            exit 1
          fi
          npm pack --dry-run --json > "$RUNNER_TEMP/aidb-pack.json" 2>/dev/null
          node -e '
            const report = require(process.env.RUNNER_TEMP + "/aidb-pack.json")[0];
            const allowed = new Set(["bin/aidb-mcp.mjs", "bin/credentials.mjs", "bin/pair.mjs", "bin/server.mjs", "LICENSE", "README.md", "package.json"]);
            const files = report.files.map((f) => f.path);
            const unexpected = files.filter((f) => !allowed.has(f));
            const missing = [...allowed].filter((f) => !files.includes(f));
            if (unexpected.length || missing.length) {
              console.error("::error::tarball content mismatch; expected: " + [...allowed].join(" "));
              if (unexpected.length) console.error("unexpected: " + unexpected.join(" "));
              if (missing.length) console.error("missing: " + missing.join(" "));
              process.exit(1);
            }
            console.log(`tarball verified: ${files.length} files`);
          '

      - name: Create publish artifact
        working-directory: packages/aidb-mcp
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/aidb-mcp"
          mkdir -p "$destination"
          npm pack --json --pack-destination "$destination" > "$RUNNER_TEMP/aidb-tarball.json"
          name=$(node -p "require(process.env.RUNNER_TEMP + '/aidb-tarball.json')[0].filename")
          case "$name" in
            *.tgz) ;;
            *) echo "::error::npm pack did not produce a .tgz tarball"; exit 1 ;;
          esac
          test -f "$destination/$name"
          (cd "$destination" && sha256sum "$name" > SHA256SUMS)
          echo "Packed $name with SHA-256 checksum"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aidb-mcp-tarball
          path: ${{ runner.temp }}/aidb-mcp/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish @aidb-studio/aidb-studio
    needs: package
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.package.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aidb-mcp-tarball
          path: dist-mcp

      # npm trusted publishing requires npm >= 11.5.1 and Node >= 22.14.0.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check toolchain and artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          node -v
          npm -v
          npm_ver=$(npm -v)
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error(`::error::npm ${process.argv[1]} does not support trusted publishing; need >= 11.5.1`);
              process.exit(1);
            }
          ' "$npm_ver"
          name=$(node -p "require('./packages/aidb-mcp/package.json').name")
          expected="mcp-v$(node -p "require('./packages/aidb-mcp/package.json').version")"
          if [ "$name" != "@aidb-studio/aidb-studio" ] || [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error::publish source identity does not match the MCP package/tag"
            exit 1
          fi
          shopt -s nullglob
          tarballs=(dist-mcp/*.tgz)
          if [ ${#tarballs[@]} -ne 1 ]; then
            echo "::error::expected exactly one MCP tarball, got ${#tarballs[@]}"
            exit 1
          fi
          (cd dist-mcp && sha256sum -c SHA256SUMS)
          echo "MCP_TARBALL=${tarballs[0]}" >> "$GITHUB_ENV"

      - name: Publish with npm provenance
        shell: bash
        run: npm publish "$MCP_TARBALL" --ignore-scripts --access public --registry=https://registry.npmjs.org --provenance

      - name: Verify published version
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./packages/aidb-mcp/package.json').version")
          for i in 1 2 3 4 5 6; do
            if [ "$(npm view @aidb-studio/aidb-studio version --registry=https://registry.npmjs.org 2>/dev/null || true)" = "$ver" ]; then
              echo "Published @aidb-studio/aidb-studio@$ver with provenance"
              exit 0
            fi
            echo "Waiting for registry visibility of @aidb-studio/aidb-studio@$ver (attempt $i)"
            sleep 10
          done
          echo "::error::published version is not visible in the registry"
          exit 1
