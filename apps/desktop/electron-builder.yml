appId: top.keiskei.aidb
# 自动更新：打包时生成 latest.yml（Windows NSIS）/ latest-linux.yml（AppImage），
# 里面是版本号、文件名与 sha512，客户端据此判断是否有新版并做差分下载。
# CI 用 --publish never，只把这份元数据产出到 release 目录，由发布步骤一并上传。
publish:
  provider: github
  owner: keiskeies
  repo: ai-db
  releaseType: release
electronVersion: 45.0.0
productName: AiDB Studio
copyright: Copyright © 2026 AiDB
directories:
  output: release
  buildResources: build
icon: build/icon.png
files:
  - dist/**/*
  - electron/**/*
  - package.json
extraResources:
  - from: ../gateway/dist
    to: gateway
  - from: dist
    to: desktop
  - from: ../../node_modules/ssh2
    to: gateway/node_modules/ssh2
  - from: ../../node_modules/asn1
    to: gateway/node_modules/asn1
  - from: ../../node_modules/safer-buffer
    to: gateway/node_modules/safer-buffer
  - from: ../../node_modules/bcrypt-pbkdf
    to: gateway/node_modules/bcrypt-pbkdf
  - from: ../../node_modules/tweetnacl
    to: gateway/node_modules/tweetnacl
  - from: ../../node_modules/@duckdb
    to: gateway/node_modules/@duckdb
  # node-oracledb 的原生绑定打不进 esbuild bundle，运行期按
  # process.platform-arch 从 gateway/node_modules/oracledb/build/Release 动态 require。
  # 缺这份目录时 Oracle 驱动会报 NJS-132（其余引擎不受影响）。
  - from: ../../node_modules/oracledb/build/Release
    to: gateway/node_modules/oracledb/build/Release
asar: true
# 工作区里 node_modules 被提升到仓库根目录，CI 中 appDir 下没有 node_modules，
# electron-builder 会误判为“未安装依赖”并在工作区内执行 npm install --production，
# 这次安装会把 devDependency 的 app-builder-bin 剪掉，随后打包自己就起不来。
# 本项目没有需要 rebuild 的原生生产依赖，直接跳过依赖重建更稳。
npmRebuild: false
# 每个安装包只保留自身架构的 DuckDB 绑定（extraResources 整目录拷贝 node_modules/@duckdb，
# 跨架构构建时另一架构的 duckdb.node 会各多出约 60 MB）。
afterPack: build/afterPack.cjs
win:
  # 发布构建强制 Authenticode 签名；CI 只从 secrets 注入 WIN_CSC_LINK /
  # WIN_CSC_KEY_PASSWORD（base64 PFX + 密码），仓库不保存证书或私钥。
  forceCodeSigning: true
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com
  # 两个架构都要出安装器：arm64 原生比 x64 模拟省电、启动快。
  # Windows on ARM 也能跑 x64 版，所以两版并存不影响老用户。
  target:
    - nsis
  # 产物名不能带空格：electron-builder 写 latest.yml 时会把空格换成 "-"，
  # 而 GitHub 上传时把空格换成 "."，两边对不上会让自动更新的下载地址 404。
  artifactName: AiDB-Studio-${version}-${arch}-setup.${ext}
mac:
  # 未指定 arch 时 electron-builder 回落到宿主架构（process.arch），只会出一个包。
  # 同时出 Apple Silicon 与 Intel 由 CI 传入 `--mac --x64 --arm64`。
  # 发布构建强制 Developer ID Application 签名与 notarization；CI 从 secrets
  # 注入 CSC_LINK / CSC_KEY_PASSWORD / CSC_NAME，以及 APPLE_ID /
  # APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID。无密钥时构建必须失败。
  forceCodeSigning: true
  hardenedRuntime: true
  notarize: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  target:
    - dmg
  category: public.app-category.developer-tools
  artifactName: AiDB-Studio-${version}-${arch}.${ext}
linux:
  # 签名策略：当前 CI 不对 AppImage/deb/rpm 做平台代码签名，也不伪装签名成功。
  # 每个产物由 GitHub build provenance 证明来源，并发布 SHA256SUMS-linux 供校验；
  # deb/rpm 的分发方应使用各自发行版密钥重新签名，AppImage 用户应核对校验和与
  # attestation。需要平台签名时必须接入维护者的 GPG/APT/RPM 密钥与受保护发布环境。
  forceCodeSigning: false
  # AppImage 免安装；deb / rpm 走发行版包管理器，装完在应用菜单里出现。
  target:
    - AppImage
    - deb
    - rpm
  category: Development
  # deb / rpm 的 Maintainer 字段必填，缺了 electron-builder 直接报错退出。
  maintainer: keiskeies <right_way@foxmail.com>
  synopsis: AI-native database studio with an autonomous agent
  # 可执行名去掉空格：安装目录里的文件名、桌面入口的 Exec 都用它。
  executableName: aidb-studio
  artifactName: AiDB-Studio-${version}-${arch}.${ext}
deb:
  # fpm 默认拿 productName（「AiDB Studio」）当包名，含空格在 deb / rpm 里都不合法。
  packageName: aidb-studio
rpm:
  packageName: aidb-studio
  # app-builder 会把 compression: xz 静默升级成 --rpm-compression xzmt
  # （fpm.go 里对 rpm 的硬编码），而 xzmt 在 2026-11 的 ubuntu runner 镜像
  # 上稳定触发 rpmbuild 崩溃（rpmbuild exit 1，无具体 stderr）。electron-builder
  # 只下发 gz/bzip2/xz/lzo，而 fpm 只认 gzip（不认识 gz），两边交集里只剩 bzip2。
  compression: bzip2
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: AiDB Studio
  runAfterFinish: true
  # 覆盖安装视为升级：保留 %APPDATA%/AiDB Studio 下的连接、历史与备份
  deleteAppDataOnUninstall: false
