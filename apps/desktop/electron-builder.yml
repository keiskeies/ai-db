appId: com.aidb.studio
electronVersion: 45.0.0
productName: AiDB Studio
copyright: Copyright © 2026 AiDB
directories:
  output: release
  buildResources: build
icon: build/icon.png
files:
  - dist/**/*
  - electron/**/*
  - package.json
extraResources:
  - from: ../gateway/dist
    to: gateway
  - from: dist
    to: desktop
  - from: ../../node_modules/ssh2
    to: gateway/node_modules/ssh2
  - from: ../../node_modules/asn1
    to: gateway/node_modules/asn1
  - from: ../../node_modules/safer-buffer
    to: gateway/node_modules/safer-buffer
  - from: ../../node_modules/bcrypt-pbkdf
    to: gateway/node_modules/bcrypt-pbkdf
  - from: ../../node_modules/tweetnacl
    to: gateway/node_modules/tweetnacl
  - from: ../../node_modules/@duckdb
    to: gateway/node_modules/@duckdb
asar: true
# 工作区里 node_modules 被提升到仓库根目录，CI 中 appDir 下没有 node_modules，
# electron-builder 会误判为“未安装依赖”并在工作区内执行 npm install --production，
# 这次安装会把 devDependency 的 app-builder-bin 剪掉，随后打包自己就起不来。
# 本项目没有需要 rebuild 的原生生产依赖，直接跳过依赖重建更稳。
npmRebuild: false
# 每个安装包只保留自身架构的 DuckDB 绑定（extraResources 整目录拷贝 node_modules/@duckdb，
# 跨架构构建时另一架构的 duckdb.node 会各多出约 60 MB）。
afterPack: build/afterPack.cjs
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
mac:
  # 未指定 arch 时 electron-builder 回落到宿主架构（process.arch），只会出一个包。
  # 同时出 Apple Silicon 与 Intel 由 CI 传入 `--mac --x64 --arm64`。
  target:
    - dmg
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  category: Development
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: AiDB Studio
  runAfterFinish: true
  # 覆盖安装视为升级：保留 %APPDATA%/AiDB Studio 下的连接、历史与备份
  deleteAppDataOnUninstall: false
